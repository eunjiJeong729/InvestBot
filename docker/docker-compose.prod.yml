# EC2 / production parity build (linux/amd64)
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up --build
#
# - network_mode: host — 호스트에 직접 설치한 MySQL에 localhost로 접속하고,
#   EC2 IAM Role 자격증명(인스턴스 프로파일)에 접근하기 위함.
# - command — run_airflow_ui.py로 scheduler+webserver를 기동. INVESTBOT_CONFIG는
#   profile별로 달라지므로 환경변수로 주입하고, 비어 있으면 즉시 에러로 중단한다.
# - stop_grace_period: 40s — run_airflow_ui.py가 SIGTERM 수신 후 자식 프로세스
#   종료를 최대 30초까지 기다리므로(run_scheduler_and_webserver), 그보다 여유를 둔다.

services:
  investbot:
    build:
      args:
        TARGETPLATFORM: linux/amd64
    platform: linux/amd64
    network_mode: host
    volumes:
      - ../infra:/app/infra:ro
      - ../src:/app/src:ro
      - ../.secrets:/app/.secrets:ro
      - ../data:/app/data
    command: ["python", "scripts/run_airflow_ui.py", "--config", "${INVESTBOT_CONFIG:?INVESTBOT_CONFIG is required}", "--no-triggerer"]
    stop_grace_period: 40s
    restart: unless-stopped
