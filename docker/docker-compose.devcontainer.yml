# Devcontainer 전용 — repo 전체 read-write 마운트 (base compose와 분리)
# Used by .devcontainer/devcontainer.json

services:
  moto:
    image: motoserver/moto:latest
    command: ["-H", "0.0.0.0", "-p", "5000"]
    ports:
      - "5000:5000"
    restart: unless-stopped

  investbot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # devcontainer(Mac)는 arm64 native 빌드 — amd64 에뮬레이션 타임아웃 방지
        TARGETPLATFORM: linux/arm64
    platform: linux/arm64
    user: root
    env_file:
      - path: ../.env
        required: false
    environment:
      TZ: Asia/Seoul
      PYTHONPATH: /app
      INVESTBOT_SECRETS_DIR: /app/.secrets
    volumes:
      - ..:/app
    working_dir: /app
    stdin_open: true
    tty: true
    restart: "no"
    depends_on:
      - moto
    entrypoint: []
    command: sleep infinity
